name: MaxNgo Scholarship data
on:
  schedule:
    - cron: '23 1,13 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maxngo-scholarship-data
  cancel-in-progress: false

jobs:
  refresh:
    if: vars.SCHOLARSHIP_ENABLED == 'true' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out app
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check out dedicated data branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: scholarship-data
          path: .scholarship-data
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify crawler and Worker
        run: |
          python3 -m unittest discover -s scholarship/tests -p 'test_*.py'
          node --test scholarship/tests/*.test.mjs
      - name: Refresh official sources and translation queue
        env:
          GEMINI_TIER: ${{ vars.GEMINI_TIER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_TIER: ${{ vars.CLOUDFLARE_TIER }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          report=$(python3 scholarship/crawl.py --state .scholarship-data/state.json --out .scholarship-data/snapshot.json)
          echo "$report"
          {
            echo '## Scholarship refresh'
            echo 'Sources, pending translations and provider health'
            echo
            echo '~~~json'
            echo "$report"
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Persist snapshot and queue
        working-directory: .scholarship-data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- snapshot.json state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh scholarship data'
            git push origin HEAD:refs/heads/scholarship-data
          fi
      - name: Synchronize D1 through Worker
        env:
          CLOUDFLARE_TIER: ${{ vars.CLOUDFLARE_TIER }}
          SCHOLARSHIP_WORKER_URL: ${{ vars.SCHOLARSHIP_WORKER_URL }}
          SCHOLARSHIP_INGEST_TOKEN: ${{ secrets.SCHOLARSHIP_INGEST_TOKEN }}
        shell: bash
        run: python3 scholarship/publish.py .scholarship-data/snapshot.json | tee -a "$GITHUB_STEP_SUMMARY"
